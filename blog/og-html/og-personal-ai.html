<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, height=630">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #FAF8F5;
    }
    .container {
      width: 1200px;
      height: 630px;
      background: #FAF8F5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
      position: relative;
    }
    .badge {
      display: inline-block;
      background: #1A2B4A;
      color: #FAF8F5;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .title {
      font-family: 'Fraunces', serif;
      font-size: 72px;
      font-weight: 700;
      color: #1A2B4A;
      line-height: 1.1;
      letter-spacing: -0.03em;
      max-width: 900px;
    }
    .title .highlight {
      color: #FF6B4A;
    }
    .subtitle {
      font-size: 28px;
      color: #64748B;
      line-height: 1.5;
      max-width: 800px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .author {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .author-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #1A2B4A;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FAF8F5;
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 700;
    }
    .author-info {
      display: flex;
      flex-direction: column;
    }
    .author-name {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 600;
      color: #1A2B4A;
    }
    .author-name .dot {
      color: #FF6B4A;
    }
    .author-url {
      font-size: 16px;
      color: #64748B;
    }
    .code-snippet {
      background: #1A2B4A;
      color: #FAF8F5;
      padding: 20px 28px;
      border-radius: 12px;
      font-family: 'SF Mono', 'Monaco', monospace;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .code-snippet .prompt {
      color: #FF6B4A;
    }
    .accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: #FF6B4A;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <span class="badge">Claude Code</span>
    </div>

    <div>
      <h1 class="title">Personal <span class="highlight">AI</span>: Mein Business Operating System</h1>
    </div>

    <p class="subtitle">Wie ich mit PAI den Überblick über mehrere Projekte behalte und Claude Code als persönlichen Assistenten nutze.</p>

    <div class="footer">
      <div class="author">
        <div class="author-avatar">HT</div>
        <div class="author-info">
          <span class="author-name">henning thies<span class="dot">.</span></span>
          <span class="author-url">henning-thies.de</span>
        </div>
      </div>
      <div class="code-snippet">
        <span class="prompt">~/pai $</span> <span>/pai:standup</span>
      </div>
    </div>

    <div class="accent-line"></div>
  </div>
</body>
</html>
